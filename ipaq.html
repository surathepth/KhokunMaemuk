<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>IPAQ รับออเดอร์ (Legacy)</title>
    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@400;600&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="https://unpkg.com/html5-qrcode"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
    <style>
        body { font-family: 'Prompt', sans-serif; background: #e8f8f5; margin: 0; padding: 0; user-select: none; -webkit-user-select: none; }
        .header { background: #2c3e50; color: white; padding: 15px; text-align: center; font-size: 20px; font-weight: bold; position: sticky; top: 0; z-index: 100; display: flex; justify-content: space-between; align-items: center; }
        .btn { padding: 12px; font-size: 16px; font-family: 'Prompt', sans-serif; border: none; border-radius: 8px; cursor: pointer; color: white; font-weight: bold; }
        .btn-blue { background: #3498db; }
        .btn-green { background: #2ecc71; }
        .btn-red { background: #e74c3c; }
        .btn-gray { background: #95a5a6; }
        
        /* Login Screen */
        #login-screen { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #2c3e50; display: flex; flex-direction: column; justify-content: center; align-items: center; z-index: 1000; }
        .login-box { background: white; padding: 30px; border-radius: 12px; text-align: center; width: 80%; max-width: 300px; box-shadow: 0 4px 15px rgba(0,0,0,0.2); }
        .login-box input { width: 100%; padding: 12px; margin: 10px 0; border: 1px solid #ccc; border-radius: 8px; font-size: 16px; text-align: center; box-sizing: border-box; }
        
        /* Table Screen */
        #table-screen { padding: 15px; display: none; }
        .table-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(100px, 1fr)); gap: 10px; margin-top: 15px; }
        .table-btn { background: white; border: 2px solid #3498db; color: #3498db; border-radius: 10px; padding: 15px 5px; font-size: 16px; font-weight: bold; cursor: pointer; text-align: center; }
        .table-btn.occupied { background: #e74c3c; border-color: #e74c3c; color: white; }
        
        /* Order Screen */
        #order-screen { display: none; height: 100vh; flex-direction: column; }
        .order-container { display: flex; flex: 1; overflow: hidden; }
        
        /* Left: Menu */
        .menu-area { flex: 2; overflow-y: auto; padding: 10px; border-right: 2px solid #ccc; background: white; }
        .category-scroll { display: flex; overflow-x: auto; white-space: nowrap; padding-bottom: 10px; margin-bottom: 10px; border-bottom: 1px solid #eee; }
        .category-btn { padding: 8px 15px; background: #ecf0f1; border-radius: 20px; margin-right: 10px; cursor: pointer; font-size: 14px; }
        .category-btn.active { background: #3498db; color: white; }
        .product-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(120px, 1fr)); gap: 10px; }
        .product-card { border: 1px solid #ddd; border-radius: 8px; padding: 10px; text-align: center; cursor: pointer; background: #f9f9f9; }
        .product-card:active { background: #d6eaf8; }
        .product-name { font-size: 14px; font-weight: bold; margin-bottom: 5px; height: 40px; overflow: hidden; }
        .product-price { color: #e74c3c; font-weight: bold; }
        
        /* Right: Cart */
        .cart-area { flex: 1.2; display: flex; flex-direction: column; background: #fdfdfd; }
        .cart-items { flex: 1; overflow-y: auto; padding: 10px; }
        .cart-item { border-bottom: 1px dashed #ccc; padding: 8px 0; font-size: 14px; display: flex; justify-content: space-between; align-items: center; }
        .cart-item-name { flex: 2; }
        .cart-item-qty { flex: 1; text-align: center; font-weight: bold; color: #3498db; }
        .cart-item-price { flex: 1; text-align: right; }
        .cart-footer { padding: 15px; background: white; border-top: 2px solid #ddd; }
        
        /* Camera */
        #camera-container { width: 100%; max-width: 400px; margin: 0 auto; display: none; }
        
        .old-item { color: #7f8c8d; }
        .new-item { font-weight: bold; color: #2ecc71; }
    </style>
</head>
<body>

    <!-- 1. หน้า Login -->
    <div id="login-screen">
        <div class="login-box">
            <h2 style="color: #2c3e50; margin-top:0;">ThepAgentBill</h2>
            <p>ระบบรับออเดอร์ (IPAQ)</p>
            <input type="text" id="login-id" placeholder="รหัสพนักงาน">
            <input type="password" id="login-pass" placeholder="รหัสผ่าน">
            <button class="btn btn-blue" style="width: 100%; margin-top: 10px;" onclick="doLogin()">เข้าสู่ระบบ</button>
        </div>
    </div>

    <!-- 2. หน้าเลือกโต๊ะ -->
    <div id="table-screen">
        <div class="header">
            <span>เลือกโต๊ะ (IPAQ)</span>
            <button class="btn btn-red" style="padding: 5px 10px; font-size: 12px;" onclick="doLogout()">ออก</button>
        </div>
        <div style="text-align: center; margin-top: 20px;">
            <button class="btn btn-green" style="width: 80%; max-width: 300px; padding: 15px; font-size: 18px;" onclick="startScanQR()">📷 สแกน QR โต๊ะ</button>
        </div>
        <div id="camera-container">
            <div id="reader" style="width:100%; margin-top: 10px;"></div>
            <button class="btn btn-red" style="width: 100%; margin-top: 5px;" onclick="stopScanQR()">❌ ยกเลิกสแกน</button>
        </div>
        <h3 style="margin-top: 30px; text-align: center;">หรือ กดเลือกโต๊ะด้านล่าง</h3>
        <div class="table-grid" id="table-grid">
            <!-- ดึงข้อมูลโต๊ะจาก Firebase มาใส่ที่นี่ -->
        </div>
    </div>

    <!-- 3. หน้ารับออเดอร์ -->
    <div id="order-screen">
        <div class="header">
            <button class="btn btn-gray" style="padding: 5px 10px;" onclick="goBackToTables()">◀ กลับ</button>
            <span id="order-table-name">โต๊ะ ?</span>
            <span style="width: 50px;"></span> <!-- Spacer -->
        </div>
        <div class="order-container">
            <!-- ฝั่งซ้าย: เมนู -->
            <div class="menu-area">
                <input type="text" id="menu-search" placeholder="🔍 ค้นหาเมนู..." style="width: 100%; padding: 10px; margin-bottom: 10px; box-sizing: border-box; border-radius: 8px; border: 1px solid #ccc; font-size: 16px;" onkeyup="filterMenu()">
                <div class="category-scroll" id="category-bar">
                    <!-- หมวดหมู่ -->
                </div>
                <div class="product-grid" id="product-grid">
                    <!-- สินค้า -->
                </div>
            </div>
            
            <!-- ฝั่งขวา: ตะกร้า -->
            <div class="cart-area">
                <div style="background: #2c3e50; color: white; padding: 10px; text-align: center; font-weight: bold;">
                    รายการสั่งของโต๊ะนี้
                </div>
                <div class="cart-items" id="cart-items">
                    <!-- รายการที่สั่งแล้ว และ รายการใหม่ -->
                </div>
                <div class="cart-footer">
                    <div style="display: flex; justify-content: space-between; font-size: 18px; font-weight: bold; margin-bottom: 10px;">
                        <span>รวมราคา (ใหม่):</span>
                        <span id="cart-total-new" style="color: #e74c3c;">0.00</span>
                    </div>
                    <button class="btn btn-green" style="width: 100%; padding: 15px; font-size: 18px;" onclick="sendOrder()">🚀 ส่งออเดอร์เข้าครัว</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        // ==========================================
        // ES5 STRICT MODE COMPATIBLE CODE FOR IOS 9
        // NO ARROW FUNCTIONS (=>)
        // NO LET/CONST (USE VAR)
        // NO TEMPLATE LITERALS (USE STRING CONCATENATION)
        // ==========================================

        // Firebase Config
        var firebaseConfig = {
            apiKey: "AIzaSyBAVKTfvs3XIB8b1FAYDOHho07PUU1hURs",
            authDomain: "thepagentbill.firebaseapp.com",
            projectId: "thepagentbill",
            storageBucket: "thepagentbill.firebasestorage.app",
            messagingSenderId: "553419544275",
            appId: "1:553419544275:web:3a6446fb238f453a7d6626",
            databaseURL: "https://thepagentbill-default-rtdb.asia-southeast1.firebasedatabase.app"
        };
        firebase.initializeApp(firebaseConfig);
        var database = firebase.database();

        // Global Variables
        var currentUser = null;
        var allTables = [];
        var allProducts = [];
        var allCategories = [];
        var currentCategory = "ทั้งหมด";
        var currentTableId = null;
        var currentTableName = "";
        var currentOrderItems = []; // สินค้าเดิมที่สั่งไปแล้ว
        var newCartItems = []; // สินค้าใหม่ที่เพิ่งกด
        var html5QrcodeScanner = null;

        // ================= LOGIC LOGIN =================
        function doLogin() {
            var inputId = document.getElementById("login-id").value;
            var inputPass = document.getElementById("login-pass").value;

            if (!inputId) { alert("กรุณากรอกรหัสพนักงาน"); return; }
            if (!inputPass) { alert("กรุณากรอกรหัสผ่าน"); return; }

            if (inputId.toLowerCase() === "admin") {
                if (inputPass !== "123" && inputPass !== "1234" && inputPass !== "admin") {
                    alert("รหัสผ่าน Admin ไม่ถูกต้อง!");
                    return;
                }
                unlockSystem({ id: "admin", name: "Master Admin" });
                return;
            }

            database.ref("erp_db_employee/" + inputId).once("value").then(function(snapshot) {
                if (snapshot.exists()) {
                    var empData = snapshot.val();
                    if (empData.password && empData.password !== inputPass) {
                        alert("รหัสผ่านพนักงานไม่ถูกต้อง");
                    } else if (!empData.password && inputPass !== "1234") {
                        alert("รหัสผ่านเริ่มต้นสำหรับพนักงานเก่าคือ 1234");
                    } else {
                        unlockSystem(empData);
                    }
                } else {
                    alert("ไม่พบรหัสพนักงานนี้ในระบบ");
                }
            }).catch(function(err) {
                alert("เชื่อมต่อฐานข้อมูลล้มเหลว: " + err.message);
            });
        }

        function unlockSystem(user) {
            currentUser = user;
            document.getElementById("login-screen").style.display = "none";
            document.getElementById("table-screen").style.display = "block";
            loadTables();
            loadProducts();
        }

        function doLogout() {
            currentUser = null;
            document.getElementById("table-screen").style.display = "none";
            document.getElementById("order-screen").style.display = "none";
            document.getElementById("login-screen").style.display = "flex";
            document.getElementById("login-id").value = "";
            document.getElementById("login-pass").value = "";
        }

        // ================= LOGIC TABLES =================
        function loadTables() {
            database.ref("erp_db_table").once("value").then(function(snapshot) {
                allTables = [];
                if (snapshot.exists()) {
                    var data = snapshot.val();
                    for (var key in data) {
                        if (data.hasOwnProperty(key)) {
                            allTables.push({ id: key, name: data[key].name || key, order: data[key].order || 999 });
                        }
                    }
                    allTables.sort(function(a, b) { return a.order - b.order; });
                }
                renderTableGrid();
            });

            // Listen for occupied tables
            database.ref("erp_db_orders").on("value", function(snapshot) {
                var occupied = {};
                if (snapshot.exists()) {
                    var data = snapshot.val();
                    for (var tId in data) {
                        if (data.hasOwnProperty(tId) && data[tId].items) {
                            occupied[tId] = true;
                        }
                    }
                }
                updateTableColors(occupied);
            });
        }

        function renderTableGrid() {
            var html = "";
            for (var i = 0; i < allTables.length; i++) {
                var t = allTables[i];
                html += '<button id="btn-table-' + t.id + '" class="table-btn" onclick="openTable(\'' + t.id + '\', \'' + t.name + '\')">' + t.name + '</button>';
            }
            document.getElementById("table-grid").innerHTML = html;
        }

        function updateTableColors(occupiedMap) {
            for (var i = 0; i < allTables.length; i++) {
                var tId = allTables[i].id;
                var btn = document.getElementById("btn-table-" + tId);
                if (btn) {
                    if (occupiedMap[tId]) {
                        btn.className = "table-btn occupied";
                    } else {
                        btn.className = "table-btn";
                    }
                }
            }
        }

        // ================= LOGIC QR SCANNER =================
        function startScanQR() {
            document.getElementById("camera-container").style.display = "block";
            if (!html5QrcodeScanner) {
                html5QrcodeScanner = new Html5Qrcode("reader");
            }
            html5QrcodeScanner.start({ facingMode: "environment" }, { fps: 10, qrbox: 250 }, function(decodedText) {
                // สมมติว่า QR code เก็บ ID โต๊ะ เช่น "T01" หรือ URL "?table=T01"
                var scannedTableId = decodedText;
                if (decodedText.indexOf("table=") !== -1) {
                    var parts = decodedText.split("table=");
                    scannedTableId = parts[1].split("&")[0];
                }
                stopScanQR();
                
                // หาชื่อโต๊ะ
                var tName = scannedTableId;
                for (var i = 0; i < allTables.length; i++) {
                    if (allTables[i].id === scannedTableId) {
                        tName = allTables[i].name;
                        break;
                    }
                }
                openTable(scannedTableId, tName);
            }).catch(function(err) {
                console.log(err);
            });
        }

        function stopScanQR() {
            document.getElementById("camera-container").style.display = "none";
            if (html5QrcodeScanner) {
                html5QrcodeScanner.stop().catch(function(err){});
            }
        }

        // ================= LOGIC ORDER =================
        function openTable(tId, tName) {
            currentTableId = tId;
            currentTableName = tName;
            document.getElementById("order-table-name").innerText = tName;
            document.getElementById("table-screen").style.display = "none";
            document.getElementById("order-screen").style.display = "flex";
            newCartItems = [];
            
            // ดึงข้อมูลบิลปัจจุบันของโต๊ะนี้
            database.ref("erp_db_orders/" + tId).once("value").then(function(snapshot) {
                currentOrderItems = [];
                if (snapshot.exists()) {
                    var data = snapshot.val();
                    if (data.items) {
                        if (Array.isArray(data.items)) {
                            currentOrderItems = data.items;
                        } else {
                            for (var key in data.items) {
                                currentOrderItems.push(data.items[key]);
                            }
                        }
                    }
                }
                renderCart();
            });
        }

        function goBackToTables() {
            if (newCartItems.length > 0) {
                if (!confirm("คุณมีรายการที่ยังไม่ได้ส่งเข้าครัว ต้องการทิ้งหรือไม่?")) return;
            }
            document.getElementById("order-screen").style.display = "none";
            document.getElementById("table-screen").style.display = "block";
        }

        // ================= LOGIC PRODUCTS =================
        function loadProducts() {
            database.ref("erp_db_product").once("value").then(function(snapshot) {
                allProducts = [];
                var catMap = {};
                if (snapshot.exists()) {
                    var data = snapshot.val();
                    for (var key in data) {
                        if (data.hasOwnProperty(key)) {
                            var p = data[key];
                            if (!p.category) p.category = "อื่นๆ";
                            catMap[p.category] = true;
                            allProducts.push(p);
                        }
                    }
                }
                allCategories = ["ทั้งหมด"];
                for (var c in catMap) { allCategories.push(c); }
                renderCategories();
                renderProducts();
            });
        }

        function renderCategories() {
            var html = "";
            for (var i = 0; i < allCategories.length; i++) {
                var c = allCategories[i];
                var activeCls = (c === currentCategory) ? "active" : "";
                html += '<button class="category-btn ' + activeCls + '" onclick="selectCategory(\'' + c + '\')">' + c + '</button>';
            }
            document.getElementById("category-bar").innerHTML = html;
        }

        function selectCategory(cat) {
            currentCategory = cat;
            document.getElementById("menu-search").value = "";
            renderCategories();
            renderProducts();
        }

        function filterMenu() {
            currentCategory = "ทั้งหมด";
            renderCategories();
            renderProducts();
        }

        function renderProducts() {
            var searchTxt = document.getElementById("menu-search").value.toLowerCase();
            var html = "";
            for (var i = 0; i < allProducts.length; i++) {
                var p = allProducts[i];
                if (currentCategory !== "ทั้งหมด" && p.category !== currentCategory) continue;
                if (searchTxt && p.name.toLowerCase().indexOf(searchTxt) === -1) continue;

                var imgUrl = p.imageUrl || 'https://via.placeholder.com/150';
                // HTML structure for product
                html += '<div class="product-card" onclick="addToCart(\'' + p.barcode + '\')">';
                html += '<img src="' + imgUrl + '" style="width: 100%; height: 80px; object-fit: cover; border-radius: 4px; margin-bottom: 5px;">';
                html += '<div class="product-name">' + p.name + '</div>';
                html += '<div class="product-price">฿' + p.price + '</div>';
                html += '</div>';
            }
            document.getElementById("product-grid").innerHTML = html;
        }

        // ================= LOGIC CART =================
        function addToCart(barcode) {
            // ค้นหาสินค้า
            var product = null;
            for (var i = 0; i < allProducts.length; i++) {
                if (allProducts[i].barcode === barcode) {
                    product = allProducts[i];
                    break;
                }
            }
            if (!product) return;
            
            // กรณี Custom Menu (นอกเมนู) ให้เด้งถามชื่อและราคา
            if (product.barcode === "00001" || product.name.indexOf("นอกเมนู") !== -1) {
                var cName = prompt("ใส่ชื่อรายการ (นอกเมนู):", "");
                if (!cName) return;
                var cPrice = prompt("ใส่ราคา (บาท):", "0");
                if (!cPrice) return;
                var cNote = prompt("หมายเหตุเพิ่มเติม (ถ้ามี):", "");
                
                newCartItems.push({
                    id: "00001",
                    name: cName,
                    price: Number(cPrice),
                    qty: 1,
                    note: cNote || "",
                    isNewItem: true
                });
                renderCart();
                return;
            }

            // เมนูปกติ หาในตะกร้าใหม่ก่อนว่ามีไหม
            var found = false;
            for (var j = 0; j < newCartItems.length; j++) {
                if (newCartItems[j].id === product.barcode) {
                    newCartItems[j].qty++;
                    found = true;
                    break;
                }
            }
            if (!found) {
                newCartItems.push({
                    id: product.barcode,
                    name: product.name,
                    price: Number(product.price),
                    qty: 1,
                    note: "",
                    isNewItem: true
                });
            }
            renderCart();
        }

        function removeNewCartItem(index) {
            newCartItems.splice(index, 1);
            renderCart();
        }

        function renderCart() {
            var html = "";
            var sumNew = 0;

            // Render old items (readonly)
            if (currentOrderItems && currentOrderItems.length > 0) {
                html += '<div style="font-size:12px; color:#95a5a6; margin-bottom:5px;">-- ของเดิม --</div>';
                for (var i = 0; i < currentOrderItems.length; i++) {
                    var oldItem = currentOrderItems[i];
                    html += '<div class="cart-item old-item">';
                    html += '<div class="cart-item-name">' + oldItem.name + '</div>';
                    html += '<div class="cart-item-qty">x' + oldItem.qty + '</div>';
                    html += '<div class="cart-item-price">฿' + (oldItem.price * oldItem.qty) + '</div>';
                    html += '</div>';
                }
                html += '<hr style="border: 0; border-top: 1px dashed #ccc;">';
            }

            // Render new items
            if (newCartItems.length === 0) {
                html += '<div style="text-align:center; color:#95a5a6; padding: 20px;">ยังไม่มีรายการสั่งใหม่</div>';
            } else {
                html += '<div style="font-size:12px; color:#2ecc71; margin-bottom:5px; font-weight:bold;">-- ของใหม่ที่กำลังสั่ง --</div>';
                for (var j = 0; j < newCartItems.length; j++) {
                    var newItem = newCartItems[j];
                    sumNew += (newItem.price * newItem.qty);
                    html += '<div class="cart-item new-item">';
                    html += '<div class="cart-item-name">' + newItem.name + '<br><small style="color:gray;font-weight:normal;cursor:pointer;" onclick="addNote(' + j + ')">📝 ' + (newItem.note || 'เพิ่มหมายเหตุ') + '</small></div>';
                    html += '<div class="cart-item-qty">x' + newItem.qty + '</div>';
                    html += '<div class="cart-item-price">฿' + (newItem.price * newItem.qty) + '</div>';
                    html += '<div style="margin-left: 10px; color:red; cursor:pointer; font-size:18px;" onclick="removeNewCartItem(' + j + ')">❌</div>';
                    html += '</div>';
                }
            }

            document.getElementById("cart-items").innerHTML = html;
            document.getElementById("cart-total-new").innerText = "฿" + sumNew.toFixed(2);
        }

        function addNote(index) {
            var currentNote = newCartItems[index].note || "";
            var note = prompt("ใส่หมายเหตุ:", currentNote);
            if (note !== null) {
                newCartItems[index].note = note;
                renderCart();
            }
        }

        // ================= SEND ORDER =================
        function sendOrder() {
            if (newCartItems.length === 0) {
                alert("กรุณาเลือกอาหารก่อนส่งออเดอร์");
                return;
            }

            var btn = document.querySelector(".cart-footer .btn-green");
            btn.innerHTML = "กำลังส่ง...";
            btn.disabled = true;

            // ผสมของเก่ากับของใหม่
            var combinedItems = [];
            for (var i = 0; i < currentOrderItems.length; i++) {
                combinedItems.push(currentOrderItems[i]);
            }
            for (var j = 0; j < newCartItems.length; j++) {
                combinedItems.push(newCartItems[j]);
            }

            // อ่านค่าปัจจุบันใน DB เผื่อมีเครื่องอื่นสั่งชนกัน
            database.ref("erp_db_orders/" + currentTableId).once("value").then(function(snapshot) {
                var orderData = {
                    queueNo: currentTableId,
                    billNumber: "",
                    cashInput: "0",
                    items: combinedItems,
                    hasNewItems: true, // ตัวแปรสำคัญที่ทำให้เครื่องแม่สั่งพิมพ์
                    time: new Date().toLocaleTimeString("th-TH", { hour: "2-digit", minute: "2-digit" })
                };

                // ถ้ามีข้อมูลเดิม ให้ผสมกับข้อมูลเก่าใน DB อีกที (ป้องกันข้อมูลหายตอนสั่งพร้อมกัน)
                if (snapshot.exists()) {
                    var existing = snapshot.val();
                    if (existing.items) {
                        var existingItems = Array.isArray(existing.items) ? existing.items : Object.values(existing.items);
                        // เอาของเดิมในฐานข้อมูลมาเป็นฐาน
                        var mergedItems = existingItems.slice();
                        // เติมของใหม่เข้าไป
                        for (var k = 0; k < newCartItems.length; k++) {
                            mergedItems.push(newCartItems[k]);
                        }
                        orderData.items = mergedItems;
                        orderData.billNumber = existing.billNumber || "";
                    }
                }

                return database.ref("erp_db_orders/" + currentTableId).set(orderData);
            }).then(function() {
                Swal.fire("สำเร็จ!", "ส่งออเดอร์เข้าครัวเรียบร้อย", "success").then(function() {
                    btn.innerHTML = "🚀 ส่งออเดอร์เข้าครัว";
                    btn.disabled = false;
                    goBackToTables();
                });
            }).catch(function(err) {
                alert("เกิดข้อผิดพลาด: " + err.message);
                btn.innerHTML = "🚀 ส่งออเดอร์เข้าครัว";
                btn.disabled = false;
            });
        }
    </script>
</body>
</html>
